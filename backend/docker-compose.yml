version: '3.8'

services:

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server

  auth-service:
    build: ./Auth-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-server
      - mysql

  notification-service:
    build: ./notification-service
    ports:
      - "8083:8083"
    depends_on:
      - discovery-server
      - mysql

  tourism-service:
    build: ./tourism-service
    ports:
      - "8084:8084"
    depends_on:
      - discovery-server
      - mysql

  booking-service:
    build: ./booking-service
    ports:
      - "8086:8086"
    depends_on:
      - discovery-server
      - mysql

  recommendation-service:
    build: ./recommendation-service
    ports:
      - "8087:8087"
    depends_on:
      - discovery-server
      - mysql

  user-service:
    build:
      context: ./user-service
    ports:
      - "8085:8085"
    depends_on:
      - discovery-server
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tourisme_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    
  mysql:
    image: mysql:8
    container_name: tourisme-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tourisme_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: