spring.application.name=api-gateway
server.port=8080
server.address=0.0.0.0
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=tourism-service
spring.cloud.gateway.routes[1].uri=lb://TOURISM-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/hotels/**,/cities/**,/restaurants/**,/beaches/**,/reviews/**,/categories,/categories/**

spring.cloud.gateway.routes[2].id=Booking-service
spring.cloud.gateway.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/Bookings/**

spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[4].id=recommendation-service
spring.cloud.gateway.routes[4].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/recommendations/**

spring.cloud.gateway.routes[5].id=user-service
spring.cloud.gateway.routes[5].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/users/**