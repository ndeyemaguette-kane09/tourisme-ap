services:

  mysql:
    image: mysql:8
    container_name: tourisme-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tourisme_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
    restart: on-failure

  auth-service:
    build: ./Auth-service
    ports:
      - "8082:8082"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: on-failure

  notification-service:
    build: ./notification-service
    ports:
      - "8083:8083"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: on-failure

  tourism-service:
    build: ./tourism-service
    ports:
      - "8084:8084"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: on-failure

  booking-service:
    build: ./Booking-service
    ports:
      - "8086:8086"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: on-failure

  recommendation-service:
    build: ./recommendation-service
    ports:
      - "8087:8087"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: on-failure

  user-service:
    build: ./user-service
    ports:
      - "8085:8085"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: on-failure

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/discover-senegal.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql_data:
