spring.application.name=recommendation-service
server.port=8087

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

spring.datasource.url=jdbc:mysql://mysql:3306/recommendation_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=60000

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans

resilience4j.circuitbreaker.instances.tourismService.sliding-window-size=10
resilience4j.circuitbreaker.instances.tourismService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tourismService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.tourismService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bookingService.sliding-window-size=10
resilience4j.circuitbreaker.instances.bookingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingService.wait-duration-in-open-state=10s
resilience4j.retry.instances.bookingService.max-attempts=2
resilience4j.retry.instances.bookingService.wait-duration=300ms
