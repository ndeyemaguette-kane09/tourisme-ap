spring.application.name=api-gateway
server.port=8080
server.address=0.0.0.0
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=tourism-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://TOURISM-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/hotels/**,/cities/**,/restaurants/**,/beaches/**,/reviews/**,/places,/places/**,/search,/search/**,/categories,/categories/**

spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/reservations/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notifications/**

spring.cloud.gateway.server.webflux.routes[4].id=recommendation-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/recommendations/**

spring.cloud.gateway.server.webflux.routes[5].id=user-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/users/**

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans
